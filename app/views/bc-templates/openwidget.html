<h1>ChatGPT product catalog helper V1.0 - by Open Resourcing</h1>
<p>I am here to advise you on your query related to our products, please provide me with your question:
<a href="#" id="a-toggle-chatgpt">view the assistant</a>
</p>
<div id="div-chatgpt-container">
  <form id="form-openai" action="#"> 
    <table style="width:100%">
      <tr>
        <td>
          <label for="textarea-openai-message">What is your question?</label>
        </td>
      </tr>
      <tr>
        <td>
          <input id="textarea-openai-message", style="width:100%"></textarea>
        </td>
      </tr>
        <td>
          <label for="textarea-openai-response">My Response response</label>
        </td>
      </tr>
      <tr>
        <td>
          <textarea id="textarea-openai-response", cols=40, rows=5, style="width:100%"></textarea>
      </tr>
      <tr>
        <td>
          <input id="btn-openai-send" type="button", value="Send">
        </td>
      </tr>
    </table>
  </form>
</div>
<script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
<script>

  var ws = null;

  $( document ).ready(function() {
    $("#div-chatgpt-container").hide(); 
    $("#a-toggle-chatgpt").click( function(e) { 
      e.preventDefault();
      $("#div-chatgpt-container").toggle(); 
    }); 
    $("#btn-openai-send").click( function(e) {
      e.preventDefault();
      const openai_message = $("#textarea-openai-message").val();
      sendMessageWS(e);
      //openAISendMessage(openai_message);
    });
  });


  function sendMessageWS(e) {
      console.log("called sendMessageWS");
      const url = 'wss://e8d3-129-126-14-65.ngrok-free.app/api/openai/send-message-ws';
//      ws = new WebSocket("ws://localhost/api/openai/send-message-ws");
      ws = new WebSocket(url);
      e.preventDefault();
      var question = $('#textarea-openai-message').val(); 
      var data = {
          question: question
      };
      var dataType = "json";

      ws.addEventListener('message', function (event) {
          onMessageFromServer(event);
      });

      ws.onopen = function() {
          console.log('websocket open!');
          ws.send(JSON.stringify(data));
      };

  };
  function onMessageFromServer(e) {
      e.preventDefault();
      if (e.data == "<aitextdone />") {
          console.log('closing websocket!');
          ws.close();
      } else {
          $("#textarea-openai-response").val( $("#textarea-openai-response").val() +e.data);
      }
  };

</script>
